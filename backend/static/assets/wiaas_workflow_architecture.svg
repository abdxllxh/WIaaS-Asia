<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" style="background:#F4EFEA; font-family:'JetBrains Mono', 'Space Grotesk', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(30, 41, 59, 0.05)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12" flood-color="#0F172A"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F4EFEA"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Outer Plate Border -->
  <rect x="16" y="16" width="1568" height="648" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Header Plate Annotations -->
  <text x="36" y="46" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.5">WIAAS PRODUCTION DECISION GRAPH · N8N ENGINE (BUILT VIA QODER)</text>
  <text x="1320" y="46" font-size="11" font-weight="700" fill="#0284C7" letter-spacing="1.5">60 NODES · 7 AI AGENTS · &lt;2,800 TOKENS</text>

  <!-- Connection Lines Layer -->
  <!-- Webhook to Parse -->
  <path d="M 90 320 L 130 320" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Parse to Switch -->
  <path d="M 210 320 L 250 320" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Switch to Top Greeting Branch -->
  <path d="M 300 295 C 320 160, 330 140, 360 140" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440 140 L 470 140" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Switch to FAQ Branch -->
  <path d="M 300 305 C 330 220, 330 220, 360 220" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440 220 L 470 220" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Switch to Fallback Branch -->
  <path d="M 300 315 C 330 300, 330 300, 360 300" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440 300 L 470 300" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Switch to Direct Fast -->
  <path d="M 300 330 L 360 380" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Switch to Sentiment Branch -->
  <path d="M 300 345 C 330 480, 330 480, 360 480" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 440 480 L 470 480" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Branches Convergence into Intent Router II -->
  <path d="M 530 140 C 560 140, 560 340, 580 340" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 530 220 C 555 220, 555 340, 580 340" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 530 300 C 555 300, 555 340, 580 340" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 430 380 C 510 380, 530 340, 580 340" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 530 480 C 560 480, 560 340, 580 340" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- Intent Router II to Registry & Match -->
  <path d="M 640 340 L 670 340" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 740 340 L 770 340" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 830 340 L 860 340" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Region Branching: Miss vs Hit -->
  <!-- Miss Branch (Upper) -->
  <path d="M 890 320 C 910 230, 920 200, 950 200" stroke="#EF4444" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1030 200 L 1060 170" stroke="#EF4444" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1030 200 L 1060 230" stroke="#EF4444" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Hit Branch (Lower): Analytics API Ingest -->
  <path d="M 890 350 C 910 400, 920 400, 950 400" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1030 400 L 1060 400" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1120 400 L 1150 400" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Fast Answer vs Deep Specialist Chain -->
  <!-- Fast Answer Direct (Upper bypass) -->
  <path d="M 1180 380 C 1210 260, 1380 260, 1430 330" stroke="#D97706" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Deep Specialist Multi-Agent Pipeline (Across bottom) -->
  <path d="M 1180 420 C 1200 490, 1220 500, 1240 500" stroke="#7C3AED" stroke-width="2.2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 1290 500 L 1320 500" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 1370 500 L 1400 500" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 1450 500 L 1480 500" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 1520 480 C 1530 400, 1480 370, 1460 360" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1480 350 L 1520 350" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ==================== NODES RENDERING ==================== -->

  <!-- Node 1: Webhook -->
  <g transform="translate(36, 296)" filter="url(#node-shadow)">
    <rect width="56" height="48" rx="8" fill="#BE185D" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="28" y="24" font-size="8" font-weight="800" fill="#FFF" text-anchor="middle">WEBHOOK</text>
    <text x="28" y="37" font-size="7" fill="#FDA4AF" text-anchor="middle">/wiaas</text>
  </g>

  <!-- Node 2: Parse Input -->
  <g transform="translate(130, 296)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="40" y="22" font-size="8" font-weight="700" fill="#F8FAFC" text-anchor="middle">PARSE INPUT</text>
    <text x="40" y="36" font-size="7" fill="#94A3B8" text-anchor="middle">JSON Body &amp; Id</text>
  </g>

  <!-- Node 3: Route Switch -->
  <g transform="translate(250, 288)" filter="url(#node-shadow)">
