    <text x="40" y="21" font-size="8" font-weight="700" fill="#DDD6FE" text-anchor="middle">Greeting Agent</text>
    <text x="40" y="34" font-size="7" fill="#A78BFA" text-anchor="middle">AI Agent 01</text>
  </g>
  <g transform="translate(470, 116)" filter="url(#node-shadow)">
    <rect width="60" height="46" rx="7" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="30" y="27" font-size="7.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Quick Resp</text>
  </g>

  <!-- FAQ -->
  <g transform="translate(360, 196)" filter="url(#node-shadow)">
    <rect width="80" height="46" rx="7" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="40" y="21" font-size="8" font-weight="700" fill="#DDD6FE" text-anchor="middle">FAQ Router</text>
    <text x="40" y="34" font-size="7" fill="#A78BFA" text-anchor="middle">AI Agent 02</text>
  </g>
  <g transform="translate(470, 196)" filter="url(#node-shadow)">
    <rect width="60" height="46" rx="7" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="30" y="27" font-size="7.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Direct FAQ</text>
  </g>

