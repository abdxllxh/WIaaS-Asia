  <g transform="translate(1060, 376)" filter="url(#node-shadow)">
    <rect width="60" height="48" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
    <text x="30" y="21" font-size="7" font-weight="700" fill="#38BDF8" text-anchor="middle">COMPACT</text>
    <text x="30" y="32" font-size="6.5" fill="#BAE6FD" text-anchor="middle">STATE</text>
    <text x="30" y="42" font-size="5.5" fill="#7DD3FC" text-anchor="middle">&lt;350 bytes</text>
  </g>

  <!-- Fast vs Deep Router -->
  <g transform="translate(1150, 380)" filter="url(#node-shadow)">
    <polygon points="0,20 15,0 30,20 15,40" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="15" y="24" font-size="6.5" font-weight="800" fill="#F59E0B" text-anchor="middle">DEPTH</text>
