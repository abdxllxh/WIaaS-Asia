    <text x="25" y="22" font-size="6.5" font-weight="700" fill="#FDE68A" text-anchor="middle">FAST</text>
    <text x="25" y="34" font-size="6" fill="#F59E0B" text-anchor="middle">&lt;200ms</text>
  </g>

  <!-- Deep Specialist Multi-Agent Pipeline (Sequential Execution) -->
  <!-- Specialist 1: Research Agent -->
  <g transform="translate(1240, 474)" filter="url(#node-shadow)">
    <rect width="50" height="52" rx="7" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.8"/>
    <text x="25" y="20" font-size="7" font-weight="700" fill="#DDD6FE" text-anchor="middle">RESEARCH</text>
    <text x="25" y="32" font-size="6" fill="#A78BFA" text-anchor="middle">AGENT 05</text>
    <text x="25" y="44" font-size="5.5" fill="#C4B5FD" text-anchor="middle">Brief Synthesis</text>
