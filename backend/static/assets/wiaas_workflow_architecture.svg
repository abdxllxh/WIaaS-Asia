  <g transform="translate(360, 276)" filter="url(#node-shadow)">
    <rect width="80" height="46" rx="7" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="40" y="21" font-size="8" font-weight="700" fill="#DDD6FE" text-anchor="middle">Fallback Clf</text>
    <text x="40" y="34" font-size="7" fill="#A78BFA" text-anchor="middle">AI Agent 03</text>
  </g>
  <g transform="translate(470, 276)" filter="url(#node-shadow)">
    <rect width="60" height="46" rx="7" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="30" y="27" font-size="7.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">FW Model</text>
  </g>

  <!-- Direct Fast -->
  <g transform="translate(360, 356)" filter="url(#node-shadow)">
    <rect width="70" height="44" rx="7" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="35" y="26" font-size="7.5" font-weight="600" fill="#BAE6FD" text-anchor="middle">Direct Fast</text>
  </g>

  <!-- Sentiment Agent -->
  <g transform="translate(360, 456)" filter="url(#node-shadow)">
    <rect width="80" height="46" rx="7" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="40" y="21" font-size="8" font-weight="700" fill="#DDD6FE" text-anchor="middle">Sentiment Agent</text>
    <text x="40" y="34" font-size="7" fill="#A78BFA" text-anchor="middle">AI Agent 04</text>
  </g>
  <g transform="translate(470, 456)" filter="url(#node-shadow)">
    <rect width="60" height="46" rx="7" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="30" y="27" font-size="7.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">Tone Guard</text>
  </g>

  <!-- Middle Intent Router II -->
  <g transform="translate(580, 316)" filter="url(#node-shadow)">
    <rect width="60" height="48" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="30" y="23" font-size="7.5" font-weight="700" fill="#FDE68A" text-anchor="middle">INTENT II</text>
    <text x="30" y="36" font-size="6.5" fill="#F59E0B" text-anchor="middle">Deep Routing</text>
  </g>

  <!-- Regional Catalog Resolver -->
  <g transform="translate(670, 316)" filter="url(#node-shadow)">
    <rect width="70" height="48" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="35" y="23" font-size="7.5" font-weight="700" fill="#BAE6FD" text-anchor="middle">ASIA REGISTRY</text>
    <text x="35" y="36" font-size="6.5" fill="#7DD3FC" text-anchor="middle">29 Territories</text>
  </g>

  <!-- Match Region Node -->
  <g transform="translate(770, 316)" filter="url(#node-shadow)">
    <rect width="60" height="48" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="30" y="23" font-size="7.5" font-weight="700" fill="#A7F3D0" text-anchor="middle">MATCH GEO</text>
    <text x="30" y="36" font-size="6.5" fill="#34D399" text-anchor="middle">Coordinate Map</text>
  </g>

  <!-- Region Condition Switch -->
  <g transform="translate(860, 320)" filter="url(#node-shadow)">
    <polygon points="0,20 15,0 30,20 15,40" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="15" y="24" font-size="7" font-weight="800" fill="#F59E0B" text-anchor="middle">FOUND?</text>
  </g>

  <!-- Miss Branch -->
  <g transform="translate(950, 176)" filter="url(#node-shadow)">
    <rect width="80" height="46" rx="7" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#FCA5A5" text-anchor="middle">Region Fallback</text>
