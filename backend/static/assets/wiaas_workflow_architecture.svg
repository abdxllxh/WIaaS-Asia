  <!-- Specialist 2: Agri Agent -->
  <g transform="translate(1320, 474)" filter="url(#node-shadow)">
    <rect width="50" height="52" rx="7" fill="#1E293B" stroke="#10B981" stroke-width="1.8"/>
    <text x="25" y="20" font-size="7" font-weight="700" fill="#A7F3D0" text-anchor="middle">AGRI</text>
    <text x="25" y="32" font-size="6" fill="#34D399" text-anchor="middle">AGENT 06</text>
    <text x="25" y="44" font-size="5.5" fill="#6EE7B7" text-anchor="middle">VPD / Soil Strat</text>
  </g>

  <!-- Specialist 3: Grid Agent -->
  <g transform="translate(1400, 474)" filter="url(#node-shadow)">
    <rect width="50" height="52" rx="7" fill="#1E293B" stroke="#EAB308" stroke-width="1.8"/>
    <text x="25" y="20" font-size="7" font-weight="700" fill="#FEF08A" text-anchor="middle">GRID</text>
    <text x="25" y="32" font-size="6" fill="#FACC15" text-anchor="middle">AGENT 07</text>
    <text x="25" y="44" font-size="5.5" fill="#FDE047" text-anchor="middle">Load &amp; Blackout</text>
