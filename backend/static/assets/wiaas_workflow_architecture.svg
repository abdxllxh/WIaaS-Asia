    <text x="40" y="23" font-size="8" font-weight="700" fill="#A7F3D0" text-anchor="middle">FASTAPI ENGINE</text>
    <text x="40" y="36" font-size="6.5" fill="#6EE7B7" text-anchor="middle">/api/v1/analytics</text>
