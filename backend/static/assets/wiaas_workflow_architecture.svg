    <rect x="0" y="0" width="12" height="12" rx="3" fill="#BE185D"/>
    <text x="18" y="10" font-size="9" fill="#475569">Webhook Trigger</text>
    <rect x="130" y="0" width="12" height="12" rx="3" fill="#1E293B" stroke="#38BDF8"/>
    <text x="148" y="10" font-size="9" fill="#475569">Deterministic Code / Registry</text>
    <rect x="330" y="0" width="12" height="12" rx="3" fill="#8B5CF6"/>
    <text x="348" y="10" font-size="9" fill="#475569">Specialist AI Agent (Fireworks / Qoder)</text>
    <rect x="610" y="0" width="12" height="12" rx="3" fill="#0F172A" stroke="#F59E0B"/>
    <text x="628" y="10" font-size="9" fill="#475569">Zero-Token Router</text>
    <rect x="770" y="0" width="12" height="12" rx="3" fill="#059669"/>
    <text x="788" y="10" font-size="9" fill="#475569">Strict JSON Output</text>
