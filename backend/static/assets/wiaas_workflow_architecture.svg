  <!-- Specialist 4: Logistics Agent -->
  <g transform="translate(1480, 474)" filter="url(#node-shadow)">
    <rect width="50" height="52" rx="7" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="25" y="20" font-size="7" font-weight="700" fill="#FED7AA" text-anchor="middle">SUPPLY</text>
    <text x="25" y="32" font-size="6" fill="#FB923C" text-anchor="middle">AGENT 08</text>
    <text x="25" y="44" font-size="5.5" fill="#FDBA74" text-anchor="middle">Fuel &amp; Corridor</text>
  </g>

  <!-- Output Assembler & Sanitizer -->
  <g transform="translate(1520, 326)" filter="url(#node-shadow)">
    <rect width="50" height="48" rx="8" fill="#059669" stroke="#34D399" stroke-width="1.8"/>
    <text x="25" y="22" font-size="7" font-weight="800" fill="#FFF" text-anchor="middle">REPORT</text>
