<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">WIaaS weather intelligence mark</title>
  <desc id="desc">A cyan weather intelligence radar mark on a midnight blue field</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122334"/>
      <stop offset="1" stop-color="#03080f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#bg)" stroke="#27445b" stroke-width="2"/>
  <path d="M32 11a21 21 0 1 0 17.3 33" fill="none" stroke="#1a506d" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 11a21 21 0 0 1 18 10" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M17 37.5c0-4.1 3.3-7.5 7.4-7.5 1-4.6 5.1-7.9 9.9-7.9 4.7 0 8.7 3.1 9.8 7.5h1.1c3.2 0 5.8 2.6 5.8 5.8s-2.6 5.8-5.8 5.8H24.4c-4.1 0-7.4-1.6-7.4-5.7Z" fill="#07131e" stroke="url(#cyan)" stroke-width="2.4" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m32 26 2.2 4.8L39 33l-4.8 2.2L32 40l-2.2-4.8L25 33l4.8-2.2L32 26Z" fill="#f0fdff" stroke="#38bdf8" stroke-width="1.1" filter="url(#glow)"/>
  <circle cx="48.5" cy="46" r="2.5" fill="#34d399" filter="url(#glow)"/>
