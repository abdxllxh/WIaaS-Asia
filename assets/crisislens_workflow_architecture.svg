    <text x="40" y="35" font-size="6.5" fill="#F59E0B" text-anchor="middle">Zero-LLM Replay</text>
  </g>
  <g transform="translate(610, 476)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#FCD34D" text-anchor="middle">FAST ACTION</text>
    <text x="40" y="35" font-size="6.5" fill="#FBBF24" text-anchor="middle">&lt;50ms Response</text>
