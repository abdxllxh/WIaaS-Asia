  <!-- Stream 2: NASA FIRMS -->
  <g transform="translate(810, 206)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#EA580C" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#FED7AA" text-anchor="middle">NASA FIRMS</text>
    <text x="40" y="36" font-size="6.5" fill="#FB923C" text-anchor="middle">Thermal Hotspots</text>
  </g>
  <g transform="translate(930, 212)" filter="url(#node-shadow)">
    <rect width="80" height="36" rx="6" fill="#0F172A" stroke="#EA580C" stroke-width="1"/>
    <text x="40" y="22" font-size="7" fill="#FFEDD5" text-anchor="middle">Wildfire Cluster</text>
  </g>

  <!-- Stream 3: GDACS Alerts -->
  <g transform="translate(810, 306)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#DC2626" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#FECACA" text-anchor="middle">GDACS ALERTS</text>
    <text x="40" y="36" font-size="6.5" fill="#F87171" text-anchor="middle">Disaster Feeds</text>
  </g>
  <g transform="translate(930, 312)" filter="url(#node-shadow)">
    <rect width="80" height="36" rx="6" fill="#0F172A" stroke="#DC2626" stroke-width="1"/>
    <text x="40" y="22" font-size="7" fill="#FEE2E2" text-anchor="middle">Flood &amp; Cyclone</text>
  </g>

  <!-- Stream 4: GDELT Intelligence -->
  <g transform="translate(810, 406)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#C7D2FE" text-anchor="middle">GDELT NEWS</text>
    <text x="40" y="36" font-size="6.5" fill="#818CF8" text-anchor="middle">OSINT Real-Time</text>
  </g>
  <g transform="translate(930, 412)" filter="url(#node-shadow)">
    <rect width="80" height="36" rx="6" fill="#0F172A" stroke="#4F46E5" stroke-width="1"/>
    <text x="40" y="22" font-size="7" fill="#E0E7FF" text-anchor="middle">Field Sitreps</text>
  </g>

  <!-- Multi-Stream Merge & Normalize -->
  <g transform="translate(1060, 256)" filter="url(#node-shadow)">
    <rect width="50" height="48" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
    <text x="25" y="22" font-size="7" font-weight="700" fill="#38BDF8" text-anchor="middle">MERGE</text>
    <text x="25" y="34" font-size="6" fill="#BAE6FD" text-anchor="middle">4 Feeds</text>
  </g>

  <g transform="translate(1140, 256)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">FILTER EVIDENCE</text>
    <text x="40" y="36" font-size="6.5" fill="#7DD3FC" text-anchor="middle">Relevance Filter</text>
  </g>

  <!-- OSINT Correlation AI Agent (Agent 01 of CrisisLens) -->
  <g transform="translate(1250, 254)" filter="url(#node-shadow)">
    <rect width="80" height="52" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="40" y="20" font-size="7.5" font-weight="800" fill="#DDD6FE" text-anchor="middle">OSINT AGENT</text>
    <text x="40" y="32" font-size="6.5" fill="#C4B5FD" text-anchor="middle">Cross-Correlation</text>
    <text x="40" y="44" font-size="6" fill="#A78BFA" text-anchor="middle">AI Agent 09</text>
  </g>

  <!-- Threat & Confidence Evaluation (Agent 02 of CrisisLens) -->
  <g transform="translate(1360, 260)" filter="url(#node-shadow)">
    <polygon points="0,20 25,0 50,20 25,40" fill="#0F172A" stroke="#DC2626" stroke-width="1.8"/>
    <text x="25" y="24" font-size="6" font-weight="800" fill="#F87171" text-anchor="middle">SEVERITY</text>
  </g>

  <!-- Action Protocol Agent (Agent 03 of CrisisLens) -->
  <g transform="translate(1440, 254)" filter="url(#node-shadow)">
    <rect width="80" height="52" rx="8" fill="#1E293B" stroke="#DC2626" stroke-width="2"/>
    <text x="40" y="20" font-size="7.5" font-weight="800" fill="#FECACA" text-anchor="middle">ACTION AGENT</text>
    <text x="40" y="32" font-size="6.5" fill="#FCA5A5" text-anchor="middle">Evacuation Corridors</text>
    <text x="40" y="44" font-size="6" fill="#F87171" text-anchor="middle">AI Agent 10</text>
