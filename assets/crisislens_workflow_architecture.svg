<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="100%" height="100%" style="background:#F4EFEA; font-family:'JetBrains Mono', 'Space Grotesk', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(30, 41, 59, 0.05)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D97706"/>
    </marker>
    <filter id="node-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12" flood-color="#0F172A"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F4EFEA"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Outer Plate Border -->
  <rect x="16" y="16" width="1568" height="648" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Header Plate Annotations -->
  <text x="36" y="46" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.5">CRISISLENS EMERGENCY MULTI-HAZARD DECISION GRAPH · N8N ENGINE (BUILT VIA QODER)</text>
  <text x="1320" y="46" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="1.5">50 NODES · 4 AI AGENTS · 4-SOURCE FUSION</text>

  <!-- Connection Pathways -->
  <!-- Webhook to Memory -->
  <path d="M 90 320 L 130 320" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <!-- Memory to Parser -->
  <path d="M 210 320 L 250 320" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <!-- Parser to Router -->
  <path d="M 330 320 L 370 320" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Router to Cached Follow-up (Direct Memory Branch) -->
  <path d="M 400 345 C 420 480, 430 500, 480 500" stroke="#D97706" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 560 500 L 610 500" stroke="#D97706" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 690 500 C 900 500, 1300 500, 1400 370" stroke="#D97706" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Router to New Assessment Geocoding -->
  <path d="M 420 320 L 480 320" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 560 320 L 600 320" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 680 320 L 720 320" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Parallel Ingestion Fan-Out -->
  <!-- Stream 1: Open-Meteo -->
  <path d="M 750 295 C 770 140, 780 130, 810 130" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 890 130 L 930 130" stroke="#0284C7" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Stream 2: NASA FIRMS -->
  <path d="M 750 310 C 780 230, 780 230, 810 230" stroke="#EA580C" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 890 230 L 930 230" stroke="#EA580C" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Stream 3: GDACS Alerts -->
  <path d="M 750 330 C 780 330, 780 330, 810 330" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 890 330 L 930 330" stroke="#DC2626" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Stream 4: GDELT News -->
  <path d="M 750 345 C 780 430, 780 430, 810 430" stroke="#4F46E5" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 890 430 L 930 430" stroke="#4F46E5" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- Parallel Streams Convergence into Merge Node -->
  <path d="M 1010 130 C 1040 130, 1040 280, 1060 280" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1010 230 C 1035 230, 1035 280, 1060 280" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1010 330 C 1035 330, 1035 280, 1060 280" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1010 430 C 1040 430, 1040 280, 1060 280" stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Merge to Filter & Threat Scoring -->
  <path d="M 1110 280 L 1140 280" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1220 280 L 1250 280" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- OSINT Correlation Agent to Threat Level & Actions -->
  <path d="M 1330 280 L 1360 280" stroke="#7C3AED" stroke-width="2.2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 1410 280 L 1440 280" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Action Agent to Strict Output -->
  <path d="M 1490 310 C 1490 350, 1490 350, 1490 350 L 1520 350" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- ==================== NODES RENDERING ==================== -->

  <!-- Node 1: Webhook Trigger -->
  <g transform="translate(36, 296)" filter="url(#node-shadow)">
    <rect width="56" height="48" rx="8" fill="#BE185D" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="28" y="24" font-size="8" font-weight="800" fill="#FFF" text-anchor="middle">WEBHOOK</text>
    <text x="28" y="37" font-size="6.5" fill="#FDA4AF" text-anchor="middle">/crisislens</text>
  </g>

  <!-- Node 2: Load Memory -->
  <g transform="translate(130, 296)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#FDE68A" text-anchor="middle">LOAD MEMORY</text>
    <text x="40" y="36" font-size="6.5" fill="#F59E0B" text-anchor="middle">Session State</text>
  </g>

  <!-- Node 3: Parse Query -->
  <g transform="translate(250, 296)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">PARSE QUERY</text>
    <text x="40" y="36" font-size="6.5" fill="#94A3B8" text-anchor="middle">Intent Extraction</text>
  </g>

  <!-- Node 4: Conversation Router -->
  <g transform="translate(370, 288)" filter="url(#node-shadow)">
