    <text x="40" y="36" font-size="6.5" fill="#6EE7B7" text-anchor="middle">Parallel Fan-Out</text>
  </g>

  <!-- Fan-out Splitter -->
  <g transform="translate(720, 305)" filter="url(#node-shadow)">
    <polygon points="0,15 15,0 30,15 15,30" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
    <text x="15" y="19" font-size="6" font-weight="800" fill="#38BDF8" text-anchor="middle">FAN</text>
  </g>

  <!-- 4 Parallel Source Nodes -->
  <!-- Stream 1: Open-Meteo -->
  <g transform="translate(810, 106)" filter="url(#node-shadow)">
    <rect width="80" height="48" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text x="40" y="22" font-size="7.5" font-weight="700" fill="#BAE6FD" text-anchor="middle">OPEN-METEO</text>
