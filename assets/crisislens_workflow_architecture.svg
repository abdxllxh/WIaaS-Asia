    <text x="25" y="22" font-size="7" font-weight="800" fill="#FFF" text-anchor="middle">CRISIS</text>
    <text x="25" y="34" font-size="6" fill="#FECACA" text-anchor="middle">DISASTER</text>
    <text x="25" y="42" font-size="5.5" fill="#FCA5A5" text-anchor="middle">DIRECTIVE</text>
  </g>

  <!-- Legend Bar at Bottom -->
  <g transform="translate(36, 610)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#BE185D"/>
    <text x="18" y="10" font-size="9" fill="#475569">Webhook Trigger</text>
    <rect x="130" y="0" width="12" height="12" rx="3" fill="#1E293B" stroke="#D97706"/>
    <text x="148" y="10" font-size="9" fill="#475569">Session State &amp; Memory</text>
    <rect x="310" y="0" width="12" height="12" rx="3" fill="#1E293B" stroke="#0284C7"/>
    <text x="328" y="10" font-size="9" fill="#475569">Parallel Live Data Ingestion</text>
    <rect x="520" y="0" width="12" height="12" rx="3" fill="#8B5CF6"/>
    <text x="538" y="10" font-size="9" fill="#475569">Specialist AI Agent (Qoder App)</text>
    <rect x="740" y="0" width="12" height="12" rx="3" fill="#991B1B"/>
    <text x="758" y="10" font-size="9" fill="#475569">Disaster Directive Output</text>
