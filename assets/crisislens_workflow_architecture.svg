  <g transform="translate(930, 112)" filter="url(#node-shadow)">
    <rect width="80" height="36" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="40" y="22" font-size="7" fill="#E0F2FE" text-anchor="middle">Weather Norm</text>
